<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prática 2 - Menu responsivo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #0b1f3a; }
    .topo { padding: 20px 6vw; background: #0b1f3a; color: white; /* TODO: display, alinhamento e espaço entre marca e menu */ }
    .marca { font-size: 1.35rem; font-weight: 850; }
    .menu { margin: 0; padding: 0; list-style: none; /* TODO: coloque os links em linha e crie gap */ }
    .menu a { color: white; text-decoration: none; }
    main { padding: 70px 6vw; }
    @media (max-width: 620px) {
      .topo { /* TODO: mude o eixo principal para coluna e alinhe no início */ }
      .menu { /* TODO: permita quebra de linha */ }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="marca">IF Tech</div>
    <nav aria-label="Principal"><ul class="menu"><li><a href="#">Cursos</a></li><li><a href="#">Projetos</a></li><li><a href="#">Contato</a></li></ul></nav>
  </header>
  <main><h1>Feira de Tecnologia</h1><p>Um menu simples para praticar eixos e responsividade.</p></main>
</body>
</html>
